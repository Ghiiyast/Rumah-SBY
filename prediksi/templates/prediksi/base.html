{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}Rumah SBY{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'prediksi/style.css' %}">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">🏠 Rumah SBY</div>
    <nav>
      <a href="{% url 'dashboard' %}" class="{% if halaman == 'dashboard' %}aktif{% endif %}">🏠 Dashboard</a>
      <a href="{% url 'prediksi' %}" class="{% if halaman == 'prediksi' %}aktif{% endif %}">🔮 Prediksi Harga</a>
      <a href="{% url 'dataset' %}" class="{% if halaman == 'dataset' %}aktif{% endif %}">📊 Dataset</a>
    </nav>
  </aside>

  <main class="utama">
    {% block isi %}{% endblock %}
  </main>

  {% block panel %}{% endblock %}
</body>
</html>
